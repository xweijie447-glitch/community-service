<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('编辑服务项目')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/common :: sidebar('items')}"></aside>
    <main class="main">
        <div th:replace="~{fragments/common :: flash}"></div>

        <div class="page-head">
            <div>
                <h1 th:text="${form.id == null} ? '新增服务项目' : '编辑服务项目'">新增服务项目</h1>
                <div class="desc">价格、单位、时长会直接影响居民端展示与智能派单的时间冲突判断</div>
            </div>
            <a class="btn btn-outline" th:href="@{/admin/items}">返回列表</a>
        </div>

        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">校验失败</div>

        <form th:action="@{/admin/items/save}" method="post" th:object="${form}" data-validate>
            <input type="hidden" th:field="*{id}">
            <div class="split">
                <section class="card">
                    <div class="card-head"><h3>基本信息</h3></div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoryId">所属分类 <span class="req">*</span></label>
                            <select class="select" id="categoryId" th:field="*{categoryId}" required>
                                <option value="">请选择</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">家政保洁</option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('categoryId')}"
                                  th:errors="*{categoryId}"></span>
                        </div>
                        <div class="form-group">
                            <label for="name">服务名称 <span class="req">*</span></label>
                            <input class="input" id="name" type="text" th:field="*{name}" required
                                   placeholder="日常保洁（2 小时）">
                            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="subtitle">一句话卖点</label>
                        <input class="input" id="subtitle" type="text" th:field="*{subtitle}"
                               placeholder="客厅卧室厨卫基础清洁">
                    </div>
                    <div class="form-group">
                        <label for="description">服务说明 <span class="req">*</span></label>
                        <textarea class="textarea" id="description" th:field="*{description}"
                                  style="min-height:180px"
                                  placeholder="服务内容：&#10;服务说明：&#10;计价方式："></textarea>
                        <span class="form-hint">支持换行，居民端按原样展示</span>
                    </div>
                </section>

                <section class="card">
                    <div class="card-head"><h3>价格与状态</h3></div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">价格（元） <span class="req">*</span></label>
                            <input class="input" id="price" type="number" step="0.01" min="0.01"
                                   th:field="*{price}" required>
                            <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                        </div>
                        <div class="form-group">
                            <label for="unit">计价单位 <span class="req">*</span></label>
                            <input class="input" id="unit" type="text" th:field="*{unit}" required placeholder="次">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="durationMinutes">预计服务时长（分钟） <span class="req">*</span></label>
                        <input class="input" id="durationMinutes" type="number" min="15" step="15"
                               th:field="*{durationMinutes}" required>
                    </div>
                    <div class="form-group">
                        <label for="status">上架状态</label>
                        <select class="select" id="status" th:field="*{status}">
                            <option th:each="s : ${T(com.community.domain.ItemStatus).values()}"
                                    th:value="${s}" th:text="${s.label}">已上架</option>
                        </select>
                    </div>
                    <label class="checkbox mb-2">
                        <input type="checkbox" th:field="*{hot}"> 标记为热门服务（首页展示）
                    </label>
                    <button class="btn btn-block btn-lg" type="submit">保存服务项目</button>
                    <a class="btn btn-ghost btn-block mt-1" th:href="@{/admin/items}">取消</a>
                </section>
            </div>
        </form>

        <footer th:replace="~{fragments/common :: footer}"></footer>
    </main>
</div>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
