<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('消息记录')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/common :: sidebar('messages')}"></aside>
    <main class="main">
        <div th:replace="~{fragments/common :: flash}"></div>

        <div class="page-head">
            <div>
                <h1>消息记录</h1>
                <div class="desc">邮件与短信由 RabbitMQ 异步发送，开发环境为模拟通道，全部落库可查</div>
            </div>
            <div class="row" style="gap:8px">
                <a class="btn btn-sm" th:classappend="${channel == ''} ? '' : 'btn-outline'"
                   th:href="@{/admin/messages}">全部</a>
                <a class="btn btn-sm" th:classappend="${channel == 'EMAIL'} ? '' : 'btn-outline'"
                   th:href="@{/admin/messages(channel='EMAIL')}">邮件</a>
                <a class="btn btn-sm" th:classappend="${channel == 'SMS'} ? '' : 'btn-outline'"
                   th:href="@{/admin/messages(channel='SMS')}">短信</a>
            </div>
        </div>

        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>时间</th>
                    <th>业务类型</th>
                    <th>通道</th>
                    <th>接收方</th>
                    <th>主题 / 内容</th>
                    <th>关联订单</th>
                    <th>状态</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${logs}">
                    <td class="text-sm" th:text="${@fmt.dt(m.createdAt)}">时间</td>
                    <td><span class="badge badge-primary" th:text="${m.bizType}">DISPATCHED</span></td>
                    <td>
                        <span class="badge" th:classappend="${m.channel == 'EMAIL'} ? 'badge-info' : 'badge-warning'"
                              th:text="${m.channel}">EMAIL</span>
                    </td>
                    <td class="text-sm" th:text="${m.recipient}">收件人</td>
                    <td style="max-width:420px">
                        <div th:text="${m.subject}">主题</div>
                        <div class="text-sm text-muted" th:text="${#strings.abbreviate(m.content, 90)}">内容</div>
                    </td>
                    <td class="mono text-sm" th:text="${m.orderNo} ?: '-'">订单号</td>
                    <td>
                        <span class="badge" th:classappend="${m.status == 'FAILED'} ? 'badge-danger' : 'badge-success'"
                              th:text="${m.status == 'SIMULATED'} ? '已模拟' : ${m.status}">已模拟</span>
                    </td>
                </tr>
                <tr th:if="${logs.isEmpty()}">
                    <td colspan="7" class="text-center text-muted" style="padding:34px">暂无消息记录</td>
                </tr>
                </tbody>
            </table>
        </div>

        <footer th:replace="~{fragments/common :: footer}"></footer>
    </main>
</div>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
