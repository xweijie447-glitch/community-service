<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('我的预约')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar('orders')}"></header>
<div th:replace="~{fragments/common :: flash}"></div>

<main class="container" style="padding-top:24px">
    <div class="page-head">
        <div>
            <h1>我的预约</h1>
            <div class="desc">共 <b th:text="${orders.totalElements}">0</b> 条预约记录，可查看进度、取消或评价</div>
        </div>
        <a class="btn" th:href="@{/services}">+ 新建预约</a>
    </div>

    <div class="row wrap mb-2" style="gap:8px">
        <a class="btn btn-sm" th:classappend="${activeStatus == null} ? '' : 'btn-outline'"
           th:href="@{/resident/orders}">全部</a>
        <a class="btn btn-sm" th:each="s : ${statuses}"
           th:classappend="${activeStatus != null and activeStatus == s} ? '' : 'btn-outline'"
           th:href="@{/resident/orders(status=${s})}" th:text="${s.label}">待接单</a>
    </div>

    <div class="stack" th:if="${!orders.empty}">
        <article class="card" th:each="v : ${orders.content}" style="padding:18px 20px">
            <div class="row-between wrap" style="align-items:flex-start;gap:12px">
                <div style="min-width:240px">
                    <div class="row" style="gap:10px">
                        <span class="badge"
                              th:classappend="'badge-' + ${v.order.status.color}"
                              th:text="${v.order.status.label}">待接单</span>
                        <span class="text-sm text-muted mono" th:text="'订单号 ' + ${v.order.orderNo}">订单号</span>
                    </div>
                    <h3 style="margin:8px 0 4px" th:text="${v.order.serviceItemName}">日常保洁</h3>
                    <div class="text-sm text-muted">
                        <span th:text="'预约时间 ' + ${@fmt.dt(v.order.appointmentTime)}">时间</span>
                        <span> · </span>
                        <span th:text="${v.order.categoryName}">分类</span>
                    </div>
                </div>
                <div style="min-width:200px">
                    <div class="text-sm text-muted">服务地址</div>
                    <div class="text-sm" th:text="${v.order.address}">阳光小区</div>
                    <div class="text-sm text-muted mt-1" th:if="${v.staffName != null}"
                         th:text="'服务人员：' + ${v.staffName} + '（' + ${v.staffPhone} + '）'">服务人员</div>
                </div>
                <div class="text-right" style="min-width:130px">
                    <div class="price">¥<span th:text="${@fmt.money(v.order.totalAmount)}">98.00</span></div>
                    <div class="row" style="justify-content:flex-end;gap:6px;margin-top:8px">
                        <a class="btn btn-outline btn-sm" th:href="@{/resident/orders/{id}(id=${v.order.id})}">详情</a>
                        <form class="inline-form" th:if="${v.order.status.name() == 'PENDING' or v.order.status.name() == 'ASSIGNED'}"
                              th:action="@{/resident/orders/{id}/cancel(id=${v.order.id})}" method="post"
                              data-confirm="确认取消该预约单？">
                            <button class="btn btn-danger-soft btn-sm" type="submit">取消</button>
                        </form>
                        <a class="btn btn-sm" th:if="${v.order.status.name() == 'COMPLETED' and !v.order.reviewed}"
                           th:href="@{/resident/orders/{id}(id=${v.order.id},review=1)}">评价</a>
                    </div>
                </div>
            </div>
        </article>
    </div>

    <div class="empty" th:if="${orders.empty}">
        <span class="icon">📋</span>
        还没有预约记录，<a th:href="@{/services}">去服务大厅看看</a>
    </div>

    <div class="pagination" th:if="${orders.totalPages > 1}">
        <a th:classappend="${orders.first} ? 'disabled'"
           th:href="@{/resident/orders(status=${activeStatus},page=${orders.number - 1})}">上一页</a>
        <span class="current" th:text="${orders.number + 1}">1</span>
        <span class="text-muted" th:text="'/ ' + ${orders.totalPages}">/ 3</span>
        <a th:classappend="${orders.last} ? 'disabled'"
           th:href="@{/resident/orders(status=${activeStatus},page=${orders.number + 1})}">下一页</a>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
