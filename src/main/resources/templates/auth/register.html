<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('注册')}"></head>
<body>
<div class="auth-wrap">
    <section class="auth-side">
        <div>
            <div class="brand" style="color:#fff;margin-bottom:40px">
                <span class="brand-mark">家</span>
                <span>社区便民服务预约系统</span>
            </div>
            <h1>注册居民账号<br>开启线上预约</h1>
            <p>填写手机号与常用地址，之后预约可自动带入，减少重复操作。服务完成后还可对师傅评价打分。</p>
        </div>
        <div style="font-size:12px;color:rgba(255,255,255,.55)">© 阳光社区物业服务中心</div>
    </section>

    <section class="auth-main">
        <div class="auth-card" style="max-width:440px">
            <h2>居民注册</h2>
            <p class="text-muted text-sm">带 <span style="color:#dc2626">*</span> 为必填项，账号注册后不可修改。</p>

            <form th:action="@{/register}" th:object="${form}" method="post" data-validate>
                <div class="form-group">
                    <label for="username">登录账号 <span class="req">*</span></label>
                    <input class="input" id="username" type="text" th:field="*{username}"
                           th:classappend="${#fields.hasErrors('username')} ? 'input-error'"
                           placeholder="4-20 位字母、数字或下划线" required autocomplete="username">
                    <span class="field-error" th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}">账号不合法</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">密码 <span class="req">*</span></label>
                        <input class="input" id="password" type="password" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'input-error'"
                               placeholder="6-20 位" required data-password autocomplete="new-password">
                        <span class="field-error" th:if="${#fields.hasErrors('password')}"
                              th:errors="*{password}">密码不合法</span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认密码 <span class="req">*</span></label>
                        <input class="input" id="confirmPassword" type="password" th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'input-error'"
                               placeholder="再次输入密码" required data-password-confirm autocomplete="new-password">
                        <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                              th:errors="*{confirmPassword}">两次密码不一致</span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="realName">姓名 <span class="req">*</span></label>
                        <input class="input" id="realName" type="text" th:field="*{realName}"
                               th:classappend="${#fields.hasErrors('realName')} ? 'input-error'"
                               placeholder="真实姓名" required>
                        <span class="field-error" th:if="${#fields.hasErrors('realName')}"
                              th:errors="*{realName}">姓名不合法</span>
                    </div>
                    <div class="form-group">
                        <label for="phone">手机号 <span class="req">*</span></label>
                        <input class="input" id="phone" type="tel" th:field="*{phone}"
                               th:classappend="${#fields.hasErrors('phone')} ? 'input-error'"
                               placeholder="11 位手机号" required>
                        <span class="field-error" th:if="${#fields.hasErrors('phone')}"
                              th:errors="*{phone}">手机号不合法</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input class="input" id="email" type="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'input-error'"
                           placeholder="用于接收预约通知（可选）">
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">邮箱不合法</span>
                </div>
                <div class="form-group">
                    <label for="address">常用地址</label>
                    <input class="input" id="address" type="text" th:field="*{address}"
                           placeholder="如：阳光小区 3 号楼 2 单元 501">
                    <span class="form-hint">填写后预约时会自动带入，可随时修改。</span>
                </div>
                <button class="btn btn-block btn-lg" type="submit">注册</button>
            </form>

            <div class="auth-switch">
                已有账号？<a th:href="@{/login}">直接登录</a>
            </div>
        </div>
    </section>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
