<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · 社区便民服务预约系统'">社区便民服务预约系统</title>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white'%3E%E5%AE%B6%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<header th:fragment="topbar(active)" class="topbar">
    <div class="container topbar-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">家</span>
            <span>社区便民服务</span>
        </a>
        <nav class="nav">
            <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">首页</a>
            <a th:href="@{/services}" th:classappend="${active == 'services'} ? 'active'">服务大厅</a>
            <a sec:authorize="hasAnyRole('RESIDENT','ADMIN')" th:href="@{/resident/orders}"
               th:classappend="${active == 'orders'} ? 'active'">我的预约</a>
            <a sec:authorize="hasRole('STAFF')" th:href="@{/staff/workbench}"
               th:classappend="${active == 'workbench'} ? 'active'">工作台</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}"
               th:classappend="${active == 'admin'} ? 'active'">管理后台</a>
        </nav>
        <div class="topbar-right">
            <div sec:authorize="isAuthenticated()" class="row">
                <a sec:authorize="hasRole('RESIDENT')" class="user-chip" th:href="@{/resident/profile}">
                    <span class="avatar" th:text="${#strings.substring(#authentication.principal.displayName, 0, 1)}">用</span>
                    <span class="meta">
                        <b th:text="${#authentication.principal.displayName}">用户</b>
                        <span th:text="${#authentication.principal.roleLabel}">角色</span>
                    </span>
                </a>
                <a sec:authorize="hasRole('STAFF')" class="user-chip" th:href="@{/staff/profile}">
                    <span class="avatar" th:text="${#strings.substring(#authentication.principal.displayName, 0, 1)}">用</span>
                    <span class="meta">
                        <b th:text="${#authentication.principal.displayName}">用户</b>
                        <span th:text="${#authentication.principal.roleLabel}">角色</span>
                    </span>
                </a>
                <a sec:authorize="hasRole('ADMIN')" class="user-chip" th:href="@{/admin/dashboard}">
                    <span class="avatar" th:text="${#strings.substring(#authentication.principal.displayName, 0, 1)}">用</span>
                    <span class="meta">
                        <b th:text="${#authentication.principal.displayName}">用户</b>
                        <span th:text="${#authentication.principal.roleLabel}">角色</span>
                    </span>
                </a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-ghost btn-sm">退出</button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()" class="row">
                <a class="btn btn-ghost btn-sm" th:href="@{/login}">登录</a>
                <a class="btn btn-sm" th:href="@{/register}">注册</a>
            </div>
        </div>
    </div>
</header>

<!-- ================= 全局提示 ================= -->
<div th:fragment="flash">
    <div th:if="${success}" th:attr="data-flash=${success},data-flash-type='success'"></div>
    <div th:if="${error}" th:attr="data-flash=${error},data-flash-type='error'"></div>
</div>

<!-- ================= 页脚 ================= -->
<footer th:fragment="footer" class="footer">
    <div class="container footer-inner">
        <div>
            <b>社区便民服务预约系统</b> · 家政保洁 / 家电维修 / 快递代收 / 上门开锁<br>
            <span class="text-muted">Spring Boot 3 + Thymeleaf + Redis + RabbitMQ · 本地文件存储</span>
        </div>
        <div class="text-right text-muted">
            服务热线 400-000-0000（8:00 - 20:00）<br>
            阳光社区物业服务中心
        </div>
    </div>
</footer>

<!-- ================= 管理端侧边栏 ================= -->
<aside th:fragment="sidebar(active)" class="sidebar">
    <a class="brand" th:href="@{/admin/dashboard}">
        <span class="brand-mark">家</span>
        <span>物业管理后台</span>
    </a>
    <div class="side-group">运营</div>
    <a class="side-link" th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
        <span class="ico">📊</span> 数据看板
    </a>
    <div class="side-group">业务</div>
    <a class="side-link" th:href="@{/admin/orders}" th:classappend="${active == 'orders'} ? 'active'">
        <span class="ico">📋</span> 派单管理
    </a>
    <a class="side-link" th:href="@{/admin/staff}" th:classappend="${active == 'staff'} ? 'active'">
        <span class="ico">👷</span> 服务人员
    </a>
    <div class="side-group">服务目录</div>
    <a class="side-link" th:href="@{/admin/categories}" th:classappend="${active == 'categories'} ? 'active'">
        <span class="ico">🗂</span> 服务分类
    </a>
    <a class="side-link" th:href="@{/admin/items}" th:classappend="${active == 'items'} ? 'active'">
        <span class="ico">🛠</span> 服务项目
    </a>
    <div class="side-group">系统</div>
    <a class="side-link" th:href="@{/admin/messages}" th:classappend="${active == 'messages'} ? 'active'">
        <span class="ico">✉️</span> 消息记录
    </a>
    <a class="side-link" th:href="@{/}" target="_blank">
        <span class="ico">🏠</span> 居民端首页
    </a>
    <div class="side-foot">
        当前登录：<span th:text="${#authentication.principal.displayName}">管理员</span><br>
        <form th:action="@{/logout}" method="post" style="margin-top:8px">
            <button class="btn btn-sm btn-outline btn-block" type="submit">退出登录</button>
        </form>
    </div>
</aside>

<!-- ================= 公共脚本 ================= -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
